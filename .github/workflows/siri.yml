name: SIRI watch  # tilbagerejsetilladelse
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python siri_watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOCATIONS: aarhus
          BEFORE: ""
      - run: |
          git config user.name "siri-bot"
          git config user.email "siri-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
